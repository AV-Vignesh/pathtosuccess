<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-font="ui" data-density="normal" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTO Track</title>
<meta name="description" content="A curriculum and evidence tracker for engineers working toward technology executive roles in IT services firms. Finance, ERP, technology breadth, and a ladder of verifiable gates.">
<meta name="theme-color" content="#08090a">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">

  <aside class="rail">
    <div class="logo"><span class="glyph">CT</span><b>CTO Track</b></div>
    <div id="railnav"></div>
    <div class="railfoot">
      <p class="faint" id="stamp" style="margin:0 0 6px"></p>
      <p class="faint" style="margin:0">Stored in this browser only. Export monthly from Progress.</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="crumb" id="crumb"></span>
      <div class="search"><input type="search" id="q" aria-label="Search lessons"></div>
      <button class="btn sm" data-action="askopen">Ask</button>
    </header>

    <div class="wrap"><div id="viewhost"></div></div>

    <section class="drawer" id="drawer" hidden aria-label="AI tutor">
      <div class="inner">
        <div class="spread" style="margin-bottom:8px">
          <strong>Tutor</strong>
          <button class="btn ghost sm" data-action="askclose">Close</button>
        </div>
        <p class="faint" id="askctx" style="margin:0 0 8px"></p>
        <textarea id="askq" placeholder="Ask about a concept, or paste a situation from your own work"></textarea>
        <div class="row" style="margin-top:9px">
          <button class="btn primary" data-action="asksend">Send</button>
          <span class="faint">Needs an API key, set in Settings.</span>
        </div>
        <div class="out" id="askout"></div>
      </div>
    </section>
  </main>

</div>

<script src="content/ladder.js"></script>
<script src="content/finance.js"></script>
<script src="content/tech.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
